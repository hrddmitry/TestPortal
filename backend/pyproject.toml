[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "hrddmitry", email = "361103516+hrddmitry@users.noreply.github.com" }
]
requires-python = ">=3.15"
dependencies = [
    "alembic>=1.20.1",
    "fastapi>=0.165.0",
    "psycopg[binary]>=3.3.9",
    "pydantic-settings>=2.16.3",
    "sqlalchemy>=2.1.9",
    "uvicorn>=0.54.0",
]

[project.scripts]
backend = "backend:main"

[build-system]
requires = ["uv_build>=0.13.10,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "import-linter>=2.17",
]
[tool.importlinter]
root_packages = ["backend"]

[[tool.importlinter.contracts]]
name = "Core does not depend on modules"
type = "forbidden"
source_modules = ["backend.core"]
forbidden_modules = ["backend.modules"]